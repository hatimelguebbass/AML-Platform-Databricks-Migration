name: Set up Terraform and TFLint
description: Installs the pinned Terraform and TFLint releases, and TFLint's azurerm ruleset, after checking their SHA-256.
inputs:
  terraform-version:
    description: Terraform release; must satisfy required_version of infra/terraform/*.
    default: "1.17.1"
  terraform-sha256:
    description: SHA-256 of terraform_<version>_linux_amd64.zip, from the release's SHA256SUMS.
    default: 4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061
  tflint-version:
    description: TFLint release.
    default: "0.65.0"
  tflint-sha256:
    description: SHA-256 of tflint_linux_amd64.zip, from the release's checksums.txt.
    default: d4c545ed2e29d6338604b586f34f544f380f70f243aa72f7b484713835eaec61
  ruleset-version:
    description: azurerm ruleset release; must match the plugin version in infra/terraform/.tflint.hcl.
    default: "0.32.0"
  ruleset-sha256:
    description: SHA-256 of tflint-ruleset-azurerm_linux_amd64.zip, from the release's checksums.txt.
    default: f1150b2dea7aef001ad07002671c75b5495f4521ddf3538ededf00896f7b0aaa
runs:
  using: composite
  steps:
    # The ruleset is placed where `tflint --init` would put it: --init calls the GitHub API and
    # checks nothing that the pinned checksum does not.
    - shell: bash
      env:
        TF_VERSION: ${{ inputs.terraform-version }}
        TF_SHA256: ${{ inputs.terraform-sha256 }}
        TFLINT_VERSION: ${{ inputs.tflint-version }}
        TFLINT_SHA256: ${{ inputs.tflint-sha256 }}
        RULESET_VERSION: ${{ inputs.ruleset-version }}
        RULESET_SHA256: ${{ inputs.ruleset-sha256 }}
      run: |
        fetch() { curl -sSfL --retry 5 --retry-all-errors -o "$1" "$2" && echo "$3  $1" | sha256sum --check --strict; }
        bin="$RUNNER_TEMP/terraform-tools" && mkdir -p "$bin"
        fetch "$RUNNER_TEMP/terraform.zip" \
          "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" "$TF_SHA256"
        fetch "$RUNNER_TEMP/tflint.zip" \
          "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" "$TFLINT_SHA256"
        fetch "$RUNNER_TEMP/ruleset.zip" \
          "https://github.com/terraform-linters/tflint-ruleset-azurerm/releases/download/v${RULESET_VERSION}/tflint-ruleset-azurerm_linux_amd64.zip" "$RULESET_SHA256"
        unzip -q -o "$RUNNER_TEMP/terraform.zip" terraform -d "$bin"
        unzip -q -o "$RUNNER_TEMP/tflint.zip" tflint -d "$bin"
        plugins="$HOME/.tflint.d/plugins/github.com/terraform-linters/tflint-ruleset-azurerm/${RULESET_VERSION}"
        mkdir -p "$plugins" && unzip -q -o "$RUNNER_TEMP/ruleset.zip" -d "$plugins"
        echo "$bin" >> "$GITHUB_PATH"
    - shell: bash
      run: terraform version && tflint --version
